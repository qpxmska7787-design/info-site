<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>추천 사이트 바로가기</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f5f5;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

header{
  background:white;
  text-align:center;
  padding:25px 15px;
  border-bottom:1px solid #ddd;
}

header h1{
  margin:0 0 8px;
  font-size:26px;
}

header p{
  margin:0;
  color:#777;
  font-size:14px;
}

.container{
  width:100%;
  max-width:1200px;
  margin:30px auto;
  padding:0 15px;
}

.banner{
  display:block;
  width:100%;
  margin-bottom:22px;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,0.12);
  transition:0.2s;
}

.banner:hover{
  transform:translateY(-3px);
  box-shadow:0 7px 20px rgba(0,0,0,0.18);
}

.banner img{
  display:block;
  width:100%;
  height:auto;
}

footer{
  text-align:center;
  padding:30px;
  color:#999;
  font-size:13px;
}

@media(max-width:600px){

  header h1{
    font-size:21px;
  }

  .container{
    margin:18px auto;
    padding:0 10px;
  }

  .banner{
    margin-bottom:14px;
    border-radius:10px;
  }

}

</style>

</head>


<body>


<header>

<h1>추천 사이트 바로가기</h1>

<p>원하는 배너를 클릭하면 해당 사이트로 이동합니다.</p>

</header>


<main class="container">


<!-- 네이버 -->

<a class="banner"
   href="https://www.naver.com/"
   target="_blank"
   rel="noopener noreferrer">

<img src="naver.png" alt="네이버 바로가기">

</a>



<!-- 다음 -->

<a class="banner"
   href="https://www.daum.net/"
   target="_blank"
   rel="noopener noreferrer">

<img src="daum.png" alt="다음 바로가기">

</a>



<!-- 유튜브 -->

<a class="banner"
   href="https://www.youtube.com/"
   target="_blank"
   rel="noopener noreferrer">

<img src="youtube.png" alt="유튜브 바로가기">

</a>



<!-- 카카오톡 -->

<a class="banner"
   href="https://www.kakaocorp.com/page/service/service/KakaoTalk"
   target="_blank"
   rel="noopener noreferrer">

<img src="kakao.png" alt="카카오톡 바로가기">

</a>



<!-- 쿠팡 -->

<a class="banner"
   href="https://www.coupang.com/"
   target="_blank"
   rel="noopener noreferrer">

<img src="coupang.png" alt="쿠팡 바로가기">

</a>


</main>


<footer>

© 2026 추천 사이트 바로가기

</footer>


</body>

</html>
