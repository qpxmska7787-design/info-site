<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>사이트 바로가기</title>
<meta name="description" content="추천 사이트 바로가기">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f3f5f7;
  color:#222;
}

header{
  background:#fff;
  text-align:center;
  padding:25px 15px;
  border-bottom:1px solid #ddd;
}

header h1{
  margin:0 0 8px;
  font-size:26px;
}

header p{
  margin:0;
  color:#777;
}

.container{
  width:100%;
  max-width:1000px;
  margin:30px auto;
  padding:0 15px;
}

/* 가로 배너 */

.banner{
  display:flex;
  align-items:center;
  width:100%;
  min-height:130px;
  margin-bottom:18px;
  padding:25px 30px;

  background:#fff;
  border-radius:12px;

  text-decoration:none;
  color:#222;

  box-shadow:0 3px 12px rgba(0,0,0,.08);

  transition:.2s;
}

.banner:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(0,0,0,.13);
}

.logo{
  width:75px;
  height:75px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  margin-right:25px;

  border-radius:12px;

  background:#1769aa;
  color:#fff;

  font-size:30px;
  font-weight:bold;
}

.content{
  flex:1;
}

.content h2{
  margin:0 0 8px;
  font-size:22px;
}

.content p{
  margin:0;
  color:#666;
  line-height:1.6;
}

.go{
  margin-left:25px;

  padding:13px 22px;

  background:#1769aa;
  color:white;

  border-radius:8px;

  font-weight:bold;
  white-space:nowrap;
}

footer{
  text-align:center;
  padding:30px;
  color:#999;
  font-size:13px;
}


/* 모바일 */

@media(max-width:650px){

  .container{
    margin:18px auto;
  }

  .banner{
    min-height:105px;
    padding:18px 15px;
  }

  .logo{
    width:55px;
    height:55px;
    margin-right:15px;
    font-size:22px;
  }

  .content h2{
    font-size:18px;
  }

  .content p{
    font-size:13px;
  }

  .go{
    display:none;
  }

}
</style>

</head>

<body>


<header>

<h1>추천 사이트 바로가기</h1>

<p>배너를 클릭하면 해당 사이트로 이동합니다.</p>

</header>


<main class="container">


<!-- 배너 1 -->

<a class="banner"
   href="https://example.com"
   target="_blank"
   rel="noopener noreferrer">

  <div class="logo">A</div>

  <div class="content">

    <h2>사이트 이름 1</h2>

    <p>
      사이트에 대한 간단한 설명을 입력하세요.
    </p>

  </div>

  <div class="go">
    바로가기 →
  </div>

</a>



<!-- 배너 2 -->

<a class="banner"
   href="https://example.com"
   target="_blank"
   rel="noopener noreferrer">

  <div class="logo">B</div>

  <div class="content">

    <h2>사이트 이름 2</h2>

    <p>
      두 번째 사이트에 대한 설명을 입력하세요.
    </p>

  </div>

  <div class="go">
    바로가기 →
  </div>

</a>



<!-- 배너 3 -->

<a class="banner"
   href="https://example.com"
   target="_blank"
   rel="noopener noreferrer">

  <div class="logo">C</div>

  <div class="content">

    <h2>사이트 이름 3</h2>

    <p>
      세 번째 사이트에 대한 설명을 입력하세요.
    </p>

  </div>

  <div class="go">
    바로가기 →
  </div>

</a>



<!-- 배너 4 -->

<a class="banner"
   href="https://example.com"
   target="_blank"
   rel="noopener noreferrer">

  <div class="logo">D</div>

  <div class="content">

    <h2>사이트 이름 4</h2>

    <p>
      네 번째 사이트에 대한 설명을 입력하세요.
    </p>

  </div>

  <div class="go">
    바로가기 →
  </div>

</a>



<!-- 배너 5 -->

<a class="banner"
   href="https://example.com"
   target="_blank"
   rel="noopener noreferrer">

  <div class="logo">E</div>

  <div class="content">

    <h2>사이트 이름 5</h2>

    <p>
      다섯 번째 사이트에 대한 설명을 입력하세요.
    </p>

  </div>

  <div class="go">
    바로가기 →
  </div>

</a>


</main>


<footer>

© 2026 사이트 바로가기

</footer>


</body>
</html>
